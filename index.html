<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Sucata Livre</title>
  <meta name="description" content="Quem junta, vende. Anuncie sua sucata e receba ofertas de quem compra perto de você.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/app.css?v=2026-11-02-14">
</head>
<body>
  <div id="faixa-versao" class="faixa-versao" hidden>
    <span>Saiu uma versão nova, com melhorias. Salve o que estiver fazendo e clique em Atualizar.</span>
    <button type="button" id="btn-atualizar" class="btn btn-claro">Atualizar</button>
  </div>

  <header class="topo">
    <button type="button" id="btn-menu" class="btn-icone" aria-label="Abrir menu" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span id="menu-badge" class="badge" hidden></span></button>
    <a href="#/" class="marca"><img src="logo-negativo.svg?v=2026-11-02-14" alt="Sucata Livre" width="166" height="30"></a>
    <!-- busca como nos classificados grandes: o material + onde -->
    <form id="busca-topo" class="busca-topo" role="search">
      <svg class="lupa" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15zM21 21l-5.2-5.2"/></svg>
      <input type="search" id="busca-texto" placeholder="Buscar latinha, cobre, papelão…" aria-label="Buscar material" autocomplete="off">
      <button type="button" id="local-topo" class="local-topo" aria-label="Trocar a localização"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="local-topo-nome">Salto</span></button>
    </form>
    <a href="#/anunciar" class="btn btn-primario btn-anunciar-topo">+ Anunciar grátis</a>
    <span id="topo-nome" class="topo-nome"></span>
  </header>

  <nav id="menu" class="menu" hidden aria-label="Menu"></nav>
  <div id="menu-fundo" class="menu-fundo" hidden></div>

  <main id="tela" class="tela" tabindex="-1"></main>

  <div id="avisos" class="avisos" aria-live="polite"></div>

  <!-- barra de app no celular: os cinco caminhos mais usados, sempre à mão do polegar -->
  <nav id="barra-app" class="barra-app" aria-label="Atalhos"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/config.js?v=2026-11-02-14"></script>
  <script src="js/fotos-materiais.js?v=2026-11-02-14"></script>
  <script src="js/novidades.js?v=2026-11-02-14"></script>
  <script src="js/acompanhante.js?v=2026-11-02-14"></script>
  <script src="js/app.js?v=2026-11-02-14"></script>
</body>
</html>
